version: 2
updates:
  # pip — memantau requirements.txt di root direktori
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    allow:
      # Izinkan semua versi untuk dependensi langsung; batching tetap aktif
      - dependency-type: "all"
    groups:
      patch:
        dependency-types:
          - "patch"
        update-types:
          - "patch"
      minor-minor:
        dependency-types:
          - "minor"
        update-types:
          - "minor"
    reviewers:
      - "macads"

  # github-actions — workflow sekali di root
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
    reviewers:
      - "macads"
